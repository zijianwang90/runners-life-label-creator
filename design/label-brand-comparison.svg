<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2500" height="1430" viewBox="0 0 2500 1430">
  <title>Runners Life Scheme A — four-brand logo comparison</title>
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e30b20"/><stop offset="1" stop-color="#b90012"/>
    </linearGradient>
    <pattern id="speed" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#fff" stroke-width="1" opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-25%" width="110%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000" flood-opacity="0.14"/>
    </filter>
    <clipPath id="runnerCrop"><rect width="128" height="144.6"/></clipPath>
    <style>
      .ui{font-family:"Arial Narrow","Roboto Condensed","Segoe UI",Arial,sans-serif}
      .model{font-weight:900;letter-spacing:-1.5px;fill:#0c0c0d}
      .feature{font-weight:600;fill:#252526}
      .micro{font-weight:800;letter-spacing:2px}
      .price{font-weight:900;letter-spacing:-2px;fill:#fff}
      .caption{font-weight:800;letter-spacing:2px;fill:#77736f}
    </style>

    <g id="saleBase">
      <rect width="2200" height="230" fill="#fff"/>
      <rect x="1" y="1" width="2198" height="228" fill="none" stroke="#d1d1d1" stroke-width="2"/>
      <path d="M0 0H250L215 230H0Z" fill="url(#red)"/>
      <path d="M0 0H250L215 230H0Z" fill="url(#speed)"/>
      <circle cx="105" cy="115" r="92" fill="#fff"/>
      <svg x="30" y="25" width="150" height="180" viewBox="0 0 128 144.6" preserveAspectRatio="xMidYMid meet" overflow="hidden" clip-path="url(#runnerCrop)">
        <image width="440.2" height="144.6" xlink:href="../logo.svg" preserveAspectRatio="xMinYMid meet"/>
      </svg>
      <line x1="600" y1="42" x2="600" y2="188" stroke="#b9b9b9" stroke-width="2"/>
      <line x1="979" y1="140" x2="979" y2="170" stroke="#d8071b" stroke-width="2"/>
      <line x1="1293" y1="140" x2="1293" y2="170" stroke="#d8071b" stroke-width="2"/>
      <path d="M1730 0H2200V230H1668Z" fill="url(#red)"/>
      <path d="M1730 0H2200V230H1668Z" fill="url(#speed)"/>
      <g class="ui" text-anchor="middle" transform="translate(1698 76) rotate(-10)">
        <circle r="72" fill="#fff" stroke="#80000c" stroke-width="7"/>
        <circle r="59" fill="none" stroke="#d4081b" stroke-width="2.5" stroke-dasharray="6 4"/>
        <text x="0" y="12" font-size="35" class="micro" fill="#c7081a">SALE</text>
      </g>
    </g>
  </defs>

  <rect width="2500" height="1430" fill="#f2f0ed"/>
  <g class="ui">
    <text x="150" y="72" font-size="42" font-weight="800" fill="#151515">Scheme A · Four Brand Comparison</text>
    <text x="150" y="113" font-size="22" fill="#77736f">Colored logos in the same 35 mm brand region · enlarged official Runners Life mark · oversized SALE seal</text>
  </g>

  <!-- Saucony -->
  <g transform="translate(150 190)" filter="url(#shadow)">
    <use xlink:href="#saleBase"/>
    <image x="270" y="45" width="300" height="140" xlink:href="assets/brands/saucony.svg" preserveAspectRatio="xMidYMid meet"/>
    <g class="ui">
      <text x="650" y="105" font-size="54" class="model">ENDORPHIN SPEED 5</text>
      <text x="653" y="162" font-size="20" class="feature">LIGHTWEIGHT &amp; RESPONSIVE</text>
      <text x="1007" y="162" font-size="20" class="feature">SPEEDROLL TECHNOLOGY</text>
      <text x="1321" y="162" font-size="20" class="feature">BUILT FOR TEMPO RUNS</text>
      <g text-anchor="middle">
        <text x="2018" y="48" font-size="19" font-weight="700" fill="#fff">REG. $229.99</text>
        <line x1="1937" y1="40" x2="2099" y2="40" stroke="#fff" stroke-width="2"/>
        <text x="1970" y="132" font-size="66" class="price">$189.99</text>
        <rect x="1870" y="157" width="200" height="39" fill="#fff"/>
        <text x="1970" y="185" font-size="22" class="micro" fill="#c7081a">SAVE $40</text>
      </g>
    </g>
  </g>

  <!-- Brooks -->
  <g transform="translate(150 490)" filter="url(#shadow)">
    <use xlink:href="#saleBase"/>
    <image x="270" y="45" width="300" height="140" xlink:href="assets/brands/brooks.svg" preserveAspectRatio="xMidYMid meet"/>
    <g class="ui">
      <text x="650" y="105" font-size="54" class="model">GHOST 16</text>
      <text x="653" y="162" font-size="20" class="feature">SOFT DNA LOFT v3 CUSHIONING</text>
      <text x="1007" y="162" font-size="20" class="feature">SMOOTH TRANSITIONS</text>
      <text x="1321" y="162" font-size="20" class="feature">EVERYDAY COMFORT</text>
      <g text-anchor="middle">
        <text x="2018" y="48" font-size="19" font-weight="700" fill="#fff">REG. $179.99</text>
        <line x1="1937" y1="40" x2="2099" y2="40" stroke="#fff" stroke-width="2"/>
        <text x="1970" y="132" font-size="66" class="price">$159.99</text>
        <rect x="1870" y="157" width="200" height="39" fill="#fff"/>
        <text x="1970" y="185" font-size="22" class="micro" fill="#c7081a">SAVE $20</text>
      </g>
    </g>
  </g>

  <!-- New Balance -->
  <g transform="translate(150 790)" filter="url(#shadow)">
    <use xlink:href="#saleBase"/>
    <image x="291" y="55" width="258" height="120" xlink:href="assets/brands/new-balance.svg" preserveAspectRatio="xMidYMid meet"/>
    <g class="ui">
      <text x="650" y="105" font-size="51" class="model">FRESH FOAM X 1080 v14</text>
      <text x="653" y="162" font-size="20" class="feature">PLUSH FRESH FOAM X</text>
      <text x="1007" y="162" font-size="20" class="feature">BREATHABLE MESH</text>
      <text x="1321" y="162" font-size="20" class="feature">SMOOTH DAILY MILES</text>
      <g text-anchor="middle">
        <text x="2018" y="48" font-size="19" font-weight="700" fill="#fff">REG. $189.99</text>
        <line x1="1937" y1="40" x2="2099" y2="40" stroke="#fff" stroke-width="2"/>
        <text x="1970" y="132" font-size="66" class="price">$159.99</text>
        <rect x="1870" y="157" width="200" height="39" fill="#fff"/>
        <text x="1970" y="185" font-size="22" class="micro" fill="#c7081a">SAVE $30</text>
      </g>
    </g>
  </g>

  <!-- ASICS -->
  <g transform="translate(150 1090)" filter="url(#shadow)">
    <use xlink:href="#saleBase"/>
    <image x="288" y="54" width="264" height="123" xlink:href="assets/brands/asics.svg" preserveAspectRatio="xMidYMid meet"/>
    <g class="ui">
      <text x="650" y="105" font-size="54" class="model">GEL-KAYANO 31</text>
      <text x="653" y="162" font-size="20" class="feature">4D GUIDANCE SYSTEM™</text>
      <text x="1007" y="162" font-size="20" class="feature">REARFOOT PureGEL™</text>
      <text x="1321" y="162" font-size="20" class="feature">STABLE LONG-RUN COMFORT</text>
      <g text-anchor="middle">
        <text x="2018" y="48" font-size="19" font-weight="700" fill="#fff">REG. $209.99</text>
        <line x1="1937" y1="40" x2="2099" y2="40" stroke="#fff" stroke-width="2"/>
        <text x="1970" y="132" font-size="66" class="price">$179.99</text>
        <rect x="1870" y="157" width="200" height="39" fill="#fff"/>
        <text x="1970" y="185" font-size="22" class="micro" fill="#c7081a">SAVE $30</text>
      </g>
    </g>
  </g>
</svg>
