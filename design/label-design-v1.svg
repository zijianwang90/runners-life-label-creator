<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1400" height="1670" viewBox="0 0 1400 1670">
  <title>Runners Life 120 × 30 mm shoe label — design v1</title>
  <desc>Four consistent label examples for New Balance, Saucony, ASICS, and Brooks.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#171717" flood-opacity="0.12"/>
    </filter>
    <style>
      .ui { font-family: "Segoe UI", Arial, sans-serif; }
      .heading { font-weight: 700; fill: #171717; letter-spacing: -1px; }
      .muted { fill: #77736f; }
      .model { font-weight: 750; fill: #171717; letter-spacing: -0.8px; }
      .feature { font-weight: 500; fill: #393735; }
      .eyebrow { font-weight: 700; letter-spacing: 2.2px; fill: #77736f; }
      .price { font-weight: 800; letter-spacing: -2.4px; fill: #171717; }
      .old-price { font-weight: 600; fill: #77736f; }
      .sale { font-weight: 800; letter-spacing: 1.8px; fill: #ffffff; }
      .dimension { font-weight: 650; letter-spacing: 1px; fill: #bf1e2d; }
    </style>
  </defs>

  <rect width="1400" height="1670" fill="#f3f1ee"/>

  <g class="ui">
    <text x="100" y="76" font-size="40" class="heading">Runners Life — Shoe Label</text>
    <text x="100" y="116" font-size="22" class="muted">Design v1 · Exact label ratio 4:1 · Final printed size 120 × 30 mm</text>
    <g transform="translate(1020 62)">
      <line x1="0" y1="14" x2="255" y2="14" stroke="#bf1e2d" stroke-width="2"/>
      <path d="M0 14l12-7v14zM255 14l-12-7v14z" fill="#bf1e2d"/>
      <text x="127.5" y="0" text-anchor="middle" font-size="17" class="dimension">120 mm</text>
    </g>
    <text x="100" y="164" font-size="17" class="eyebrow">UNIFIED SYSTEM · FOUR BRAND EXAMPLES</text>
  </g>

  <!-- New Balance -->
  <g transform="translate(100 210)" filter="url(#shadow)">
    <rect width="1200" height="300" fill="#ffffff" stroke="#d8d4cf" stroke-width="2"/>
    <rect width="16" height="300" fill="#bf1e2d"/>
    <image x="46" y="20" width="246" height="68" xlink:href="../logo.svg" preserveAspectRatio="xMinYMid meet"/>
    <image x="958" y="19" width="196" height="70" xlink:href="assets/brands/new-balance.svg" preserveAspectRatio="xMaxYMid meet"/>
    <line x1="46" y1="99" x2="1154" y2="99" stroke="#dedbd7" stroke-width="2"/>

    <g class="ui">
      <text x="48" y="151" font-size="43" class="model">Fresh Foam X 1080 v14</text>
      <circle cx="54" cy="188" r="4" fill="#bf1e2d"/>
      <text x="70" y="195" font-size="22" class="feature">Plush Fresh Foam X cushioning</text>
      <circle cx="54" cy="226" r="4" fill="#bf1e2d"/>
      <text x="70" y="233" font-size="22" class="feature">Breathable engineered mesh</text>
      <circle cx="54" cy="264" r="4" fill="#bf1e2d"/>
      <text x="70" y="271" font-size="22" class="feature">Smooth comfort for everyday miles</text>

      <rect x="890" y="113" width="264" height="164" rx="8" fill="#f5f3f0"/>
      <rect x="912" y="126" width="72" height="28" rx="14" fill="#bf1e2d"/>
      <text x="948" y="147" text-anchor="middle" font-size="15" class="sale">SALE</text>
      <text x="912" y="216" font-size="61" class="price">$159.99</text>
      <text x="912" y="252" font-size="21" class="old-price">REG. $189.99</text>
      <line x1="974" y1="244" x2="1063" y2="244" stroke="#77736f" stroke-width="2"/>
    </g>
  </g>

  <!-- Saucony -->
  <g transform="translate(100 570)" filter="url(#shadow)">
    <rect width="1200" height="300" fill="#ffffff" stroke="#d8d4cf" stroke-width="2"/>
    <rect width="16" height="300" fill="#bf1e2d"/>
    <image x="46" y="20" width="246" height="68" xlink:href="../logo.svg" preserveAspectRatio="xMinYMid meet"/>
    <image x="924" y="25" width="230" height="56" xlink:href="assets/brands/saucony.svg" preserveAspectRatio="xMaxYMid meet"/>
    <line x1="46" y1="99" x2="1154" y2="99" stroke="#dedbd7" stroke-width="2"/>

    <g class="ui">
      <text x="48" y="151" font-size="43" class="model">Endorphin Speed 4</text>
      <circle cx="54" cy="188" r="4" fill="#bf1e2d"/>
      <text x="70" y="195" font-size="22" class="feature">Responsive PWRRUN PB cushioning</text>
      <circle cx="54" cy="226" r="4" fill="#bf1e2d"/>
      <text x="70" y="233" font-size="22" class="feature">Winged nylon plate for daily speed</text>
      <circle cx="54" cy="264" r="4" fill="#bf1e2d"/>
      <text x="70" y="271" font-size="22" class="feature">Fast training and race-day versatility</text>

      <rect x="890" y="113" width="264" height="164" rx="8" fill="#f5f3f0"/>
      <rect x="912" y="126" width="72" height="28" rx="14" fill="#bf1e2d"/>
      <text x="948" y="147" text-anchor="middle" font-size="15" class="sale">SALE</text>
      <text x="912" y="216" font-size="61" class="price">$199.99</text>
      <text x="912" y="252" font-size="21" class="old-price">REG. $229.99</text>
      <line x1="974" y1="244" x2="1063" y2="244" stroke="#77736f" stroke-width="2"/>
    </g>
  </g>

  <!-- ASICS -->
  <g transform="translate(100 930)" filter="url(#shadow)">
    <rect width="1200" height="300" fill="#ffffff" stroke="#d8d4cf" stroke-width="2"/>
    <rect width="16" height="300" fill="#bf1e2d"/>
    <image x="46" y="20" width="246" height="68" xlink:href="../logo.svg" preserveAspectRatio="xMinYMid meet"/>
    <image x="950" y="24" width="204" height="58" xlink:href="assets/brands/asics.svg" preserveAspectRatio="xMaxYMid meet"/>
    <line x1="46" y1="99" x2="1154" y2="99" stroke="#dedbd7" stroke-width="2"/>

    <g class="ui">
      <text x="48" y="151" font-size="43" class="model">GEL-KAYANO 31</text>
      <circle cx="54" cy="188" r="4" fill="#bf1e2d"/>
      <text x="70" y="195" font-size="22" class="feature">Adaptive 4D GUIDANCE SYSTEM™</text>
      <circle cx="54" cy="226" r="4" fill="#bf1e2d"/>
      <text x="70" y="233" font-size="22" class="feature">Soft rearfoot PureGEL™ technology</text>
      <circle cx="54" cy="264" r="4" fill="#bf1e2d"/>
      <text x="70" y="271" font-size="22" class="feature">Stable cushioning for longer runs</text>

      <rect x="890" y="113" width="264" height="164" rx="8" fill="#f5f3f0"/>
      <rect x="912" y="126" width="72" height="28" rx="14" fill="#bf1e2d"/>
      <text x="948" y="147" text-anchor="middle" font-size="15" class="sale">SALE</text>
      <text x="912" y="216" font-size="61" class="price">$179.99</text>
      <text x="912" y="252" font-size="21" class="old-price">REG. $209.99</text>
      <line x1="974" y1="244" x2="1063" y2="244" stroke="#77736f" stroke-width="2"/>
    </g>
  </g>

  <!-- Brooks -->
  <g transform="translate(100 1290)" filter="url(#shadow)">
    <rect width="1200" height="300" fill="#ffffff" stroke="#d8d4cf" stroke-width="2"/>
    <rect width="16" height="300" fill="#bf1e2d"/>
    <image x="46" y="20" width="246" height="68" xlink:href="../logo.svg" preserveAspectRatio="xMinYMid meet"/>
    <image x="916" y="27" width="238" height="50" xlink:href="assets/brands/brooks.svg" preserveAspectRatio="xMaxYMid meet"/>
    <line x1="46" y1="99" x2="1154" y2="99" stroke="#dedbd7" stroke-width="2"/>

    <g class="ui">
      <text x="48" y="151" font-size="43" class="model">Ghost 16</text>
      <circle cx="54" cy="188" r="4" fill="#bf1e2d"/>
      <text x="70" y="195" font-size="22" class="feature">Soft DNA LOFT v3 cushioning</text>
      <circle cx="54" cy="226" r="4" fill="#bf1e2d"/>
      <text x="70" y="233" font-size="22" class="feature">Smooth heel-to-toe transitions</text>
      <circle cx="54" cy="264" r="4" fill="#bf1e2d"/>
      <text x="70" y="271" font-size="22" class="feature">Balanced comfort for everyday running</text>

      <rect x="890" y="113" width="264" height="164" rx="8" fill="#f5f3f0"/>
      <rect x="912" y="126" width="72" height="28" rx="14" fill="#bf1e2d"/>
      <text x="948" y="147" text-anchor="middle" font-size="15" class="sale">SALE</text>
      <text x="912" y="216" font-size="61" class="price">$149.99</text>
      <text x="912" y="252" font-size="21" class="old-price">REG. $179.99</text>
      <line x1="974" y1="244" x2="1063" y2="244" stroke="#77736f" stroke-width="2"/>
    </g>
  </g>

  <g class="ui" transform="translate(58 210)">
    <line x1="0" y1="0" x2="0" y2="300" stroke="#bf1e2d" stroke-width="2"/>
    <path d="M0 0l-7 12h14zM0 300l-7-12h14z" fill="#bf1e2d"/>
    <text x="-16" y="150" transform="rotate(-90 -16 150)" text-anchor="middle" font-size="17" class="dimension">30 mm</text>
  </g>
</svg>
